name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-x64
            os: macos-latest
            build_command: npm run build:mac:x64
          - id: mac-arm64
            os: macos-latest
            build_command: npm run build:mac:arm64
          - id: linux
            os: ubuntu-latest
            build_command: npm run build:linux
          - id: win
            os: windows-latest
            build_command: npm run build:win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.build_command }}
        env:
          # Optional: bakes a Spotify Client ID into the app (Settings → Secrets → Actions)
          MAIN_VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          # The app is not code-signed yet
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Drop per-arch mac update metadata
        if: startsWith(matrix.id, 'mac-')
        run: rm -f dist/latest-mac.yml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk "/^## \[v${VERSION}\]/{p=1;next} /^## \[v/{p=0} p" CHANGELOG.md > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect release files
        run: |
          mkdir -p release-upload
          find release-artifacts -type f \
            ! -name 'latest-mac-x64.yml' \
            ! -name 'latest-mac-arm64.yml' \
            -exec cp {} release-upload/ \;
          node scripts/merge_latest_mac_yml.mjs \
            release-artifacts/mac-x64/latest-mac-x64.yml \
            release-artifacts/mac-arm64/latest-mac-arm64.yml \
            release-upload/latest-mac.yml

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-upload/*
